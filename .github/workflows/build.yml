name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test the zoom logic
        run: cargo test --locked

      - name: Package the .hnmod
        run: python3 tools/native.py package .

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: classic_zoom
          path: target/classic_zoom-*.hnmod
